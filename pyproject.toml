[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpa-forecast"
version = "0.1.0"
description = "Hierarchical quarterly revenue and P&L forecast for Alphabet from public SEC filings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Qin (Allan) Dai" }]
requires-python = ">=3.10,<3.13"
# Direct dependencies; requirements.txt pins the full environment used for the published numbers.
dependencies = [
  "statsforecast==2.1.1",
  "hierarchicalforecast==1.5.3",
  "utilsforecast==0.2.17",
  "duckdb==2.0.0",
  "pandas==2.3.3",
  "numpy==2.4.6",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
  "lxml==6.1.3",
  "requests==2.34.2",
  "reportlab==5.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
timesfm = ["timesfm[torch]==3.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
